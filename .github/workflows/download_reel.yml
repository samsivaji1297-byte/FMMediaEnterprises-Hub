name: Reel & Carousel Extraction Engine

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Instagram Reel or Carousel URL'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Latest Tools & Browser Impersonator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp gallery-dl openai-whisper curl_cffi

      - name: Fetch Media & Extract Metadata
        run: |
          mkdir -p output
          URL="${{ github.event.inputs.media_url }}"
          
          # Try gallery-dl first for photo carousels
          gallery-dl --directory output/ "$URL" || true
          
          # Download video content via yt-dlp with browser impersonation
          yt-dlp --impersonate Chrome --write-info-json -o "output/%(title).30s [%(id)s].%(ext)s" "$URL" || true

      - name: Parse Metadata Caption
        shell: python
        run: |
          import json
          import glob
          
          files = glob.glob('output/*.info.json')
          if files:
              with open(files[0], 'r', encoding='utf-8') as f:
                  data = json.load(f)
              desc = data.get('description', '') or ''
              with open('output/caption.txt', 'w', encoding='utf-8') as f:
                  f.write(desc)
              print("Caption extracted successfully.")
          else:
              print("No metadata json found, skipping caption parse.")

      - name: Transcribe Spoken Audio
        run: |
          MP4_FILE=$(find output -name "*.mp4" | head -n 1)
          if [ -n "$MP4_FILE" ]; then
            whisper "$MP4_FILE" --model tiny --output_format txt --output_dir output/
            mv output/*.txt output/transcript.txt 2>/dev/null || true
          fi

      - name: Extract Frame Screenshots (1 FPS)
        run: |
          MP4_FILE=$(find output -name "*.mp4" | head -n 1)
          if [ -n "$MP4_FILE" ]; then
            mkdir -p output/screenshots
            ffmpeg -i "$MP4_FILE" -vf "fps=1" output/screenshots/frame_%03d.png
          fi

      - name: Commit & Store Assets in Repo
        run: |
          FOLDER_NAME="extraction_$(date +'%Y%m%d_%H%M%S')"
          mkdir -p "reels_analysis/$FOLDER_NAME"
          
          cp -r output/* "reels_analysis/$FOLDER_NAME/" 2>/dev/null || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reels_analysis/
          git commit -m "Extracted Reel/Carousel assets [skip ci]" || echo "No changes to commit"
          git push
