name: IP Integrity Engine

on:
  schedule:
    - cron: "0 */12 * * *"  # every 12 hours, adjust as you like
  workflow_dispatch:

jobs:
  repair-ip-integrity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Run IP Integrity Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python repair_ip_integrity.py

      - name: Commit changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "IP Integrity Engine: repair missing definitions"
            git push
          else
            echo "No changes to commit."
