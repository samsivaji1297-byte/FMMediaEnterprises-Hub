name: Autonomous SEO Research Pipeline (Ingestion Only)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Target Topic / Keyword to Research (Leave empty for random seed)'
        required: false
        default: ''

  schedule:
    - cron: '0 9 * * *'

jobs:
  run-research-harvest:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Research Engine Scraper
        env:
          INPUT_TOPIC: ${{ github.event.inputs.topic }}
        run: |
          if [ -z "$INPUT_TOPIC" ]; then
            echo "=== No manual topic provided. Triggering random seed harvest from seed_topics.txt ==="
            python research_engine.py
          else
            echo "=== Harvesting SERP Signals for Custom Topic: '$INPUT_TOPIC' ==="
            python research_engine.py "$INPUT_TOPIC"
          fi

      - name: Commit and Push Captured Intelligence
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add ResearchFactory/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(research): persist captured SERP intelligence [skip ci]" && git push)
