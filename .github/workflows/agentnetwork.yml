name: Digital War Room Multi-Agent Fleet Network

on:
  schedule:
    - cron: '0 */6 * * *'  # Runs every 6 hours
  workflow_dispatch:

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System & FFmpeg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gtts google-generativeai requests pillow moviepy

      - name: Execute Full War Room Fleet Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python AgentNetwork/main.py

      - name: Commit Updated Vault Queue, Conversion Log & Intelligence Memory
        run: |
          git config --global user.name "WarRoom-Bot"
          git config --global user.email "bot@warroom.internal"
          git add MediaFactory/vault/ vault/
          git commit -m "vault: update published queue, conversion logs & analytics intelligence state [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
