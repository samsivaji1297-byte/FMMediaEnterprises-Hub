name: Demand Database Harvester

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI
  schedule:
    - cron: '0 4 * * *' # Runs automatically once daily at 04:00 UTC

jobs:
  harvest-demand:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed so the workflow can commit updated JSON files back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Upstream Demand Harvester
        run: |
          python DemandDatabase/demand_harvester.py
          python DemandDatabase/demand_synthesizer.py

      - name: Commit and Push Demand Data
        run: |
          git config --global user.name "Aurelian Automaton"
          git config --global user.email "automaton@fmmmedia.internal"
          git add DemandDatabase/
          git status
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto: Update upstream demand database harvest [skip ci]"
          git push
