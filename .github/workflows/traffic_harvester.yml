name: Demand Harvester & Utility Matrix Compiler

on:
  schedule:
    # Runs daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harvest-and-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google API client (for GSC telemetry)
        run: pip install google-api-python-client google-auth

      - name: Run Demand Harvester
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GSC_CREDENTIALS_JSON: ${{ secrets.GSC_CREDENTIALS_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python demand_harvester.py

      - name: Compile Micro-Utilities & Sitemap
        env:
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: python matrix_compiler.py

      - name: Commit and push updated utilities
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add validated_demand.json tools/ sitemap.xml robots.txt
          git diff --staged --quiet || git commit -m "chore: harvest demand & compile micro-utilities"
          git push
