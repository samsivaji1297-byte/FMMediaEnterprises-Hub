name: GrowthAgent Autonomous Reels Loop

on:
  schedule:
    # Runs every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  run-growth-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Autonomous Growth Agent Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          python GrowthAgent/main_agent.py

      - name: Commit Updated Analytics & Auto-Tuned Prompts
        run: |
          git config --global user.name "GrowthAgent[bot]"
          git config --global user.email "growthagent-bot@users.noreply.github.com"
          git add GrowthAgent/data/ GrowthAgent/output/
          git diff-index --quiet HEAD || (git commit -m "auto(growth-agent): update performance database & prompt tuning [skip ci]" && git push)
