name: GrowthAgent Autonomous Reels Loop

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-growth-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f GrowthAgent/requirements.txt ]; then pip install -r GrowthAgent/requirements.txt; fi

      # STEP 1: Render Video Only
      - name: Synthesize Script & Render Video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python GrowthAgent/main_agent.py TIMELINE_REJECTION --theme sovereign --stage render

      # STEP 2: Commit & Push Rendered Assets
      - name: Commit & Push Rendered Assets
        run: |
          git config --global user.name "GrowthAgent[bot]"
          git config --global user.email "growthagent-bot@users.noreply.github.com"
          git add GrowthAgent/output/ GrowthAgent/data/
          git diff-index --quiet HEAD || (git commit -m "auto(growth-agent): update performance database & rendered video assets [skip ci]" && git push)

      # STEP 3: Publish to Instagram using Committed Raw URL
      - name: Execute Meta API Upload & Optimization Loop
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.IG_USER_ID }}
          META_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python GrowthAgent/main_agent.py TIMELINE_REJECTION --stage publish
