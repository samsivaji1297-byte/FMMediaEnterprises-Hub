name: Blogger Automated Pipeline

concurrency:
  group: blogger-pipeline
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # Automatically runs once a day at 12:00 UTC

jobs:
  pick_transform_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install groq

      - name: Pick Random File & Stage to DistributionPlatforms/Blogger
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python stage_and_transform.py

      - name: Publish Staged File to Blogger
        env:
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python publish_to_blogger.py "DistributionPlatforms/Blogger"

      - name: Commit Staged Files Back to Repo
        run: |
          git add DistributionPlatforms/Blogger/
          git commit -m "Auto-staged new Blogger post [skip ci]" || echo "No changes to commit"
          git push
