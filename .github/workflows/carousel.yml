name: Automated IG Carousel Engine

on:
  workflow_dispatch:

jobs:
  generate-slides:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer Dependencies
        run: |
          npm init -y
          npm install puppeteer

      - name: Execute Carousel Render Script
        run: node generate-carousel.js

      - name: Save Artifact Output
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel-slide
          path: output-slide-1.png
