<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>CommandHub - Sovereign OS</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --text-heading: #f0f6fc;
      --accent: #238636;
      --accent-hover: #2ea043;
      --secondary: #21262d;
      --secondary-hover: #30363d;
      --muted: #8b949e;
      --badge-bg: #1f6feb;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 16px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    h1 {
      font-size: 1.25rem;
      color: var(--text-heading);
      letter-spacing: -0.5px;
    }

    .status-tag {
      font-size: 0.75rem;
      background: var(--secondary);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 12px;
      color: var(--muted);
    }

    .deck-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      transition: opacity 0.3s ease;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .badge {
      background: var(--badge-bg);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 4px;
      text-transform: uppercase;
    }

    .id-tag {
      font-size: 0.75rem;
      color: var(--muted);
      font-family: monospace;
    }

    .content-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-heading);
      white-space: pre-wrap;
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .timestamp-group {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    input[type="datetime-local"] {
      background: var(--secondary);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      flex: 1;
      color-scheme: dark;
    }

    .btn {
      padding: 10px 14px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      border: 1px solid transparent;
      text-align: center;
    }

    .btn-secondary {
      background: var(--secondary);
      color: var(--text);
      border-color: var(--border);
      width: 100%;
    }

    .btn-secondary:active {
      background: var(--secondary-hover);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      flex: 1;
    }

    .btn-primary:active {
      background: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .loading, .empty-state, .error-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--muted);
      font-size: 0.9rem;
      background: var(--card-bg);
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .error-state { color: #f85149; }
  </style>
</head>
<body>

  <header>
    <h1>CommandHub OS</h1>
    <span class="status-tag">Pending Deck</span>
  </header>

  <main id="feed-container" class="deck-container">
    <div class="loading">Loading dispatches...</div>
  </main>

  <script src="app.js"></script>
</body>
</html>
