name: Autonomous War Room Execution

on:
  schedule:
    - cron: '0 */6 * * *' # Runs every 6 hours
  workflow_dispatch: # Allows manual trigger directly in GitHub web UI

jobs:
  run-agents:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Grand Strategist
        run: python AgentNetwork/agents/grand_strategist.py

      - name: Execute Revenue Enforcer
        run: python AgentNetwork/agents/revenue_enforcer.py

      - name: Execute Vanguard Miner
        run: python AgentNetwork/agents/vanguard_miner.py

      - name: Commit State Updates back to Repo
        run: |
          git config --global user.name 'WarRoom-Bot'
          git config --global user.email 'warroom@bot.local'
          git add vault/
          git commit -m "Auto-update War Map state & content queue [skip ci]" || exit 0
          git push
