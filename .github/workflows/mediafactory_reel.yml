name: MediaFactory - Generate & Vault Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Reel Topic (Leave blank for dynamic random selection)'
        required: false
        default: ''
      theme:
        description: 'Design Theme Preset (Leave blank for dynamic random selection)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - ambient
          - sovereign
          - kinetic
  schedule:
    - cron: '0 10 * * *'  # Runs automatically every day

jobs:
  build-and-vault:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick fonts-liberation
        sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r MediaFactory/requirements.txt

    - name: Run Engine & Vault Asset
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: |
        cd MediaFactory/src
        python main.py --topic "${{ github.event.inputs.topic }}" --theme "${{ github.event.inputs.theme }}"

    - name: Auto-Publish Reel to Instagram
      env:
        IG_USER_ID: ${{ secrets.IG_USER_ID }}
        IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      run: |
        cd MediaFactory/src
        python publisher.py

    - name: Commit & Push Vault Assets to Repository
      run: |
        git config --global user.name "MediaFactory Bot"
        git config --global user.email "bot@mediafactory.local"
        git add MediaFactory/vault/
        git commit -m "vault: archive rendered reel & script metadata [skip ci]" || echo "No changes to commit"
        git push
