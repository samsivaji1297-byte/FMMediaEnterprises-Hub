name: Render Reel Preview Artifact

on:
  workflow_dispatch: # Allows you to trigger builds manually from the GitHub Actions tab

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (FFmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python dependencies & Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install playwright gtts
          playwright install chromium --with-deps

      - name: Generate Sovereign Reel
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python ContentFactory/reels/generate_reel.py

      - name: Upload Reel MP4 as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-reel-preview-${{ github.run_number }}
          path: ContentFactory/reels/output/output-reel.mp4
          retention-days: 3
