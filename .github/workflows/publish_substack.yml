name: Substack Note Dispatch Pipeline

on:
  push:
    paths:
      - 'WritingFactory/*.md'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml requests

      - name: Transform Draft with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python DistributionPlatforms/scripts/transform.py

      - name: Publish to Substack
        env:
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
        run: |
          python DistributionPlatforms/scripts/publish_substack.py

      - name: Archive Published Draft
        run: |
          mkdir -p WritingFactory/archive
          mv WritingFactory/*.md WritingFactory/archive/ 2>/dev/null || true
          git config --global user.name 'FMMedia Enterprise Engine'
          git config --global user.email 'automation@fmmedia.local'
          git add .
          git commit -m "chore: archive dispatched WritingFactory post" || exit 0
          git push
