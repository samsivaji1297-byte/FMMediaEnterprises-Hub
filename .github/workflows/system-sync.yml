name: System Data Sync Worker

on:
  schedule:
    - cron: "0 0 * * *"   # Runs daily (forces GitHub parser to index immediately)
  workflow_dispatch:      # Allows manual trigger from the browser UI

jobs:
  sync-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: pip install groq

      - name: Execute Worker Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python sync_worker.py
