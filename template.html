<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IG Carousel Hook Studio</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@800;900&display=swap');

    :root {
      --bg-color: #050505;
      --text-white: #FFFFFF;
      --accent-red: #FF3B30;
      --line-color: #262626;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      width: 1080px;
      height: 1350px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 120px 96px;
      overflow: hidden;
    }

    .content-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .hook-main {
      font-family: 'Inter', sans-serif;
      font-weight: 900;
      font-size: 5.7rem;
      line-height: 1.05;
      text-transform: uppercase;
      color: var(--text-white);
      letter-spacing: -0.03em;
      margin-bottom: 28px;
    }

    .hook-sub {
      font-family: 'Instrument Serif', serif;
      font-size: 4.2rem;
      font-weight: 400;
      color: var(--text-white);
      line-height: 1.2;
      position: relative;
    }

    .accent-word {
      position: relative;
      display: inline-block;
      white-space: nowrap;
    }

    .accent-word::after {
      content: '';
      position: absolute;
      bottom: -8px;
      left: -4px;
      right: -4px;
      height: 8px;
      background-color: var(--accent-red);
      border-radius: 50px;
      transform: rotate(-1deg);
    }

    .divider-line {
      width: 65%;
      height: 3px;
      background-color: var(--line-color);
      margin-top: 96px;
    }

    .slide-dots {
      position: absolute;
      bottom: 60px;
      display: flex;
      gap: 16px;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #333;
    }

    .dot.active {
      background-color: #3B82F6;
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <div class="hook-main">BUILD A PRODUCT</div>
    <div class="hook-sub">
      in 90 minutes using <span class="accent-word">these 4 triggers</span>
    </div>
    <div class="divider-line"></div>
  </div>

  <div class="slide-dots">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

</body>
</html>
