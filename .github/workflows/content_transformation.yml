name: Content Transformation Engine (Consumer)

on:
  workflow_run:
    workflows: ["Autonomous SEO Research Pipeline (Ingestion Only)"]
    types:
      - completed
  workflow_dispatch:

jobs:
  transform-and-stage:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Multi-Channel Content Assets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python stage_and_transform.py

      - name: Commit Generated Distribution Assets
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add DistributionPlatforms/
          git diff --quiet && git diff --staged --quiet || (git commit -m "feat(content): generate and stage multi-channel assets [skip ci]" && git push)
