name: Reel & Carousel Extraction Engine

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Instagram Reel or Carousel URL'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Latest Tools & Python Extractor
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp instaloader openai-whisper curl_cffi

      - name: Fetch Media (Photo Carousels & Videos)
        shell: python
        run: |
          import os
          import sys
          import subprocess
          import instaloader

          url = "${{ github.event.inputs.media_url }}".strip()
          os.makedirs("output/media", exist_ok=True)

          # Extract shortcode from Instagram URL (e.g. /p/De39wVMAQlT/ -> De39wVMAQlT)
          shortcode = ""
          parts = url.rstrip('/').split('/')
          for i, p in enumerate(parts):
              if p in ['p', 'reel', 'reels'] and i + 1 < len(parts):
                  shortcode = parts[i+1]
                  break

          print(f"Target Shortcode: {shortcode}")

          # 1. Download Photo Carousel via Instaloader
          if shortcode:
              try:
                  L = instaloader.Instaloader(
                      download_videos=False,
                      download_video_thumbnails=False,
                      download_post_captions=True,
                      download_comments=False,
                      save_metadata=False,
                      dirname_pattern="output/media"
                  )
                  post = instaloader.Post.from_shortcode(L.context, shortcode)
                  L.download_post(post, target="output/media")
                  print("Instaloader completed photo extraction.")
              except Exception as e:
                  print(f"Instaloader notice: {e}")

          # 2. Download Video Content / Reels via yt-dlp
          cmd = [
              "yt-dlp",
              "--impersonate", "Chrome",
              "--write-info-json",
              "-o", "output/media/slide_%(playlist_index)s_%(title).20s [%(id)s].%(ext)s",
              url
          ]
          subprocess.run(cmd)

      - name: Parse Metadata Caption
        shell: python
        run: |
          import json
          import glob
          import os

          # Gather captions from metadata JSON or instaloader txt
          caption = ""
          json_files = glob.glob('output/media/*.info.json')
          txt_files = glob.glob('output/media/*.txt')

          if json_files:
              try:
                  with open(json_files[0], 'r', encoding='utf-8') as f:
                      data = json.load(f)
                      caption = data.get('description', '') or ''
              except Exception as e:
                  pass

          if not caption and txt_files:
              try:
                  with open(txt_files[0], 'r', encoding='utf-8') as f:
                      caption = f.read()
              except Exception as e:
                  pass

          os.makedirs('output', exist_ok=True)
          with open('output/caption.txt', 'w', encoding='utf-8') as f:
              f.write(caption)
          print("Caption parsed successfully.")

      - name: Process All Carousel Video Slides (Whisper & Screenshots)
        run: |
          mkdir -p output/transcripts
          mkdir -p output/screenshots
          
          # Find all video MP4 files extracted across the carousel
          COUNT=1
          find output/media -type f -name "*.mp4" | sort | while read -r MP4_FILE; do
            echo "Processing video slide $COUNT: $MP4_FILE"
            
            # Transcribe audio for video slides
            whisper "$MP4_FILE" --model tiny --output_format txt --output_dir output/transcripts/ || true
            if [ -f "output/transcripts/*.txt" ]; then
              mv output/transcripts/*.txt "output/transcripts/slide_${COUNT}_transcript.txt" 2>/dev/null || true
            fi

            # Extract 1 FPS screenshots into dedicated slide folder
            SLIDE_SHOTS="output/screenshots/slide_${COUNT}"
            mkdir -p "$SLIDE_SHOTS"
            ffmpeg -i "$MP4_FILE" -vf "fps=1" "$SLIDE_SHOTS/frame_%03d.png"
            
            COUNT=$((COUNT+1))
          done

      - name: Commit & Store Assets in Repo
        run: |
          FOLDER_NAME="extraction_$(date +'%Y%m%d_%H%M%S')"
          mkdir -p "reels_analysis/$FOLDER_NAME"
          
          # Move all downloaded media (JPG, PNG, MP4, JSON) and parsed assets
          cp -r output/* "reels_analysis/$FOLDER_NAME/" 2>/dev/null || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reels_analysis/
          git commit -m "Extracted Reel/Carousel assets [skip ci]" || echo "No changes to commit"
          git push
