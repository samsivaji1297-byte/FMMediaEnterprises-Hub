name: Temporary File Migration

on:
  workflow_dispatch:

jobs:
  migrate-ip-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git Identity
        run: |
              git config --global user.name "github-actions[bot]"
              git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Move files to IPLab1
        run: |
          mkdir -p WritingFactory/IPDriven/IPLab1
          
          # Iterate and git-move everything inside WritingFactory/IPDriven except IPLab1 itself
          for item in WritingFactory/IPDriven/*; do
            filename=$(basename "$item")
            if [ "$filename" != "IPLab1" ]; then
              git mv "$item" WritingFactory/IPDriven/IPLab1/
            fi
          done
          
          # Commit and push changes back to the repo
          git add .
          git commit -m "chore: relocate files into WritingFactory/IPDriven/IPLab1"
          git push
