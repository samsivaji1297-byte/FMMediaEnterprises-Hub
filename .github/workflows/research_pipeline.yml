name: Autonomous SEO Research Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Target Topic / Keyword to Research'
        required: true
        default: 'High Agency Mindset and Systemic Execution'

jobs:
  research:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Run Search-Grounded SEO Research
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python research_engine.py "${{ github.event.inputs.topic || 'High Agency Mindset and Systemic Execution' }}"

      - name: Commit SEO Brief to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ResearchFactory/
          git commit -m "Add new autonomous SEO Research Brief [skip ci]" || echo "No changes to commit"
          git push
