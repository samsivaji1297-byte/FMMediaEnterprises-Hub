name: Transform Content & Post Substack Note

on:
  push:
    paths:
      - 'WritingFactory/*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai pyyaml requests playwright playwright-stealth
          playwright install --with-deps chromium

      - name: Transform Draft via Gemini API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python DistributionPlatforms/scripts/transform.py

      - name: Publish Note to Substack via Stealth Browser
        env:
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
        run: |
          xvfb-run python DistributionPlatforms/scripts/publish_substack.py

      - name: Commit Generated Artifacts
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/latest_payload.json || true
          git diff --staged --quiet || git commit -m "auto: save generated payload [skip ci]"
          git push
