name: Automated IG Carousel Engine

on:
  workflow_dispatch:

jobs:
  generate-slides:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install google-genai groq playwright
          playwright install chromium --with-deps

      - name: Execute Carousel Generation Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate_carousel.py

      - name: Save Rendered Slide Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel-slide
          path: output-slide-1.png
