<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>THE SOVEREIGN CIRCUIT — OPERATOR REEL</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
:root{
    --u:1; /* scale factor for 1080x1920 canvas */
    --bg:#050505;
    --accent:#00FF87;
    --white:#FFFFFF;
}
html,body{
    margin:0; padding:0; overflow:hidden; background:var(--bg);
    width:100vw; height:100vh; display:flex; justify-content:center; align-items:center;
    font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;
    color:var(--white);
}
#stage{
    position:relative;
    width:1080px; height:1920px;
    transform:scale(var(--u));
    transform-origin:top left;
    overflow:hidden;
}
canvas{
    position:absolute; top:0; left:0; width:100%; height:100%;
}
.overlay{
    position:absolute; inset:0; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:30px;
}
.text{
    font-size:48px; line-height:1.2; text-align:center; opacity:0;
}
.masked{
    position:relative; overflow:hidden;
}
.masked::after{
    content:''; position:absolute; inset:0;
    background:var(--bg);
    transform-origin:left;
    transform:scaleX(calc(1 - var(--mask,0)));
}
.badge{
    display:inline-block; margin-left:12px; padding:4px 8px;
    background:rgba(0,255,135,0.15); color:var(--accent);
    border:1px solid var(--accent); border-radius:4px;
    font-size:28px; opacity:0;
}
.card{
    width:720px; padding:40px; background:rgba(5,5,5,0.9);
    border:2px solid var(--accent); border-radius:12px;
    text-align:center; opacity:0; transform:translateY(80px);
}
.price{
    font-size:72px; margin-top:20px; color:var(--accent);
}
.cta{
    font-size:56px; letter-spacing:2px; opacity:0;
}
.grid{
    position:absolute; inset:0;
    background:repeating-linear-gradient(
        0deg,
        rgba(255,255,255,0.02) 0,
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 20px
    ),
    repeating-linear-gradient(
        90deg,
        rgba(255,255,255,0.02) 0,
        rgba(255,255,255,0.02) 1px,
        transparent 1px,
        transparent 20px
    );
}
</style>
</head>
<body>
<div id="stage">
    <canvas id="bg"></canvas>
    <div class="grid"></div>
    <div class="overlay">
        <div id="hook" class="text masked" style="--mask:0;">SYSTEM OVERRIDE:<br>3 LAWS OF OPERATOR AUTONOMY</div>
        <div id="laws" class="text"></div>
        <div id="card" class="card">
            <div style="font-size:48px;">TIMELINE REJECTION PROTOCOL</div>
            <div style="font-size:28px; opacity:0.7;">VALUE</div>
            <div id="price" class="price">$0</div>
        </div>
        <div id="cta" class="cta">FOLLOW @THEFINALMINDSET</div>
    </div>
</div>
<script>
(() => {
    const stage = document.getElementById('stage');
    const root = document.documentElement;
    const bg = document.getElementById('bg');
    const ctx = bg.getContext('2d');
    const hook = document.getElementById('hook');
    const lawsDiv = document.getElementById('laws');
    const card = document.getElementById('card');
    const priceEl = document.getElementById('price');
    const cta = document.getElementById('cta');

    // Resize handling
    function resize(){
        const vw = window.innerWidth;
        const vh = window.innerHeight;
        const targetW = Math.min(vw, vh * 9/16);
        const scale = targetW / 1080;
        root.style.setProperty('--u', scale);
        bg.width = 1080; bg.height = 1920;
    }
    window.addEventListener('resize', resize);
    resize();

    // Noise & radial glow
    const noiseCanvas = document.createElement('canvas');
    noiseCanvas.width = 1080; noiseCanvas.height = 1920;
    const nctx = noiseCanvas.getContext('2d');

    function drawNoise(){
        const imgData = nctx.createImageData(1080,1920);
        const data = imgData.data;
        for(let i=0;i<data.length;i+=4){
            const v = Math.random()*255;
            data[i]=data[i+1]=data[i+2]=255;
            data[i+3]=v<30?10:0; // sparse specks
        }
        nctx.putImageData(imgData,0,0);
    }
    drawNoise();

    // Animation timeline
    const start = performance.now();

    const phase = {
        hook: {start:0, dur:2000},
        laws: {start:2500, perChar:45},
        card: {start:9000, dur:2000},
        price: {start:11500, dur:1500},
        cta: {start:14000, dur:1000}
    };
    const laws = [
        "LAW 01: ELIMINATE FRICTION",
        "LAW 02: REJECT DISTRACTION",
        "LAW 03: OWN THE ENGINE"
    ];
    let typed = "";
    let lawIndex = 0;
    let charTimer = 0;

    function easeOutCubic(t){return 1-Math.pow(1-t,3);}
    function easeOutBack(t){
        const c1=1.70158;
        return 1+ c1 * Math.pow(t-1,3) + c1 * Math.pow(t-1,2);
    }

    function update(now){
        const t = now - start;

        // Hook mask
        if(t>=phase.hook.start && t<=phase.hook.start+phase.hook.dur){
            const p = (t-phase.hook.start)/phase.hook.dur;
            hook.style.setProperty('--mask', easeOutCubic(p));
            hook.style.opacity = 1;
        }else if(t>phase.hook.start+phase.hook.dur){
            hook.style.setProperty('--mask',1);
            hook.style.opacity = 1;
        }

        // Laws typing
        if(t>=phase.laws.start){
            if(lawIndex < laws.length){
                if(charTimer<=0){
                    const current = laws[lawIndex];
                    if(typed.length < current.length){
                        typed += current[typed.length];
                        charTimer = phase.laws.perChar;
                    }else{
                        // add badge
                        typed += `<span class="badge">✅</span>`;
                        lawIndex++;
                        typed = "";
                    }
                }else{
                    charTimer--;
                }
                lawsDiv.innerHTML = typed;
            }else{
                lawsDiv.style.opacity = 1;
            }
        }

        // Card reveal
        if(t>=phase.card.start && t<=phase.card.start+phase.card.dur){
            const p = (t-phase.card.start)/phase.card.dur;
            card.style.opacity = p;
            card.style.transform = `translateY(${(1-p)*80}px)`;
        }else if(t>phase.card.start+phase.card.dur){
            card.style.opacity = 1;
            card.style.transform = 'translateY(0)';
        }

        // Price ticker
        if(t>=phase.price.start && t<=phase.price.start+phase.price.dur){
            const p = (t-phase.price.start)/phase.price.dur;
            const val = Math.floor(easeOutBack(p)*97);
            priceEl.textContent = `$${val}`;
        }else if(t>phase.price.start+phase.price.dur){
            priceEl.textContent = "$97";
        }

        // CTA
        if(t>=phase.cta.start && t<=phase.cta.start+phase.cta.dur){
            const p = (t-phase.cta.start)/phase.cta.dur;
            cta.style.opacity = p;
        }else if(t>phase.cta.start+phase.cta.dur){
            cta.style.opacity = 1;
        }

        // Draw background
        ctx.clearRect(0,0,1080,1920);
        // radial glow
        const grad = ctx.createRadialGradient(540,960,0,540,960,800);
        grad.addColorStop(0,'rgba(0,255,135,0.12)');
        grad.addColorStop(1,'rgba(5,5,5,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0,0,1080,1920);
        // noise overlay
        ctx.globalAlpha = 0.07;
        ctx.drawImage(noiseCanvas,0,0);
        ctx.globalAlpha = 1;
    }

    function loop(){
        const now = performance.now();
        update(now);
        requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
})();
</script>
</body>
</html>
