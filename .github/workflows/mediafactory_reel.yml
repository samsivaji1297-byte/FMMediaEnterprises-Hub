name: MediaFactory - Generate Reel

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Reel Topic'
        required: true
        default: 'Ruthless Time Reclamation'
  schedule:
    - cron: '0 10 * * *'

jobs:
  build-reel:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & ImageMagick)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick
        sudo sed -i 's/policy domain="path" rights="none" pattern="@\*"/policy domain="path" rights="read|write" pattern="@\*"/' /etc/ImageMagick-6/policy.xml

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r MediaFactory/requirements.txt

    - name: Run Reel Engine
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      run: |
        TOPIC="${{ github.event.inputs.topic }}"
        if [ -z "$TOPIC" ]; then
          TOPIC="Sovereign Execution"
        fi
        cd MediaFactory/src
        python main.py --topic "$TOPIC"

    - name: Upload Finished Reel Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mediafactory-reel
        path: MediaFactory/src/final_reel.mp4
