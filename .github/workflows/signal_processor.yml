name: Signal Processor Engine

on:
  repository_dispatch:
    types: [signal_capture]

jobs:
  process-signal:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Signal Processor Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAW_TEXT: ${{ github.event.client_payload.raw_text }}
          SIGNAL_TYPE: ${{ github.event.client_payload.signal_type }}
        run: node scripts/process_signal.js

      - name: Commit & Push Changes
        run: |
          git config --global user.name "CommandHub Engine"
          git config --global user.email "engine@commandhub.local"
          git add MemoryVault/dashboard_feed.json
          git commit -m "auto: process signal into dispatches" || exit 0
          git push
