name: Autonomous Video Reel Engine (Every 2 Hours)

on:
  workflow_dispatch:
  schedule:
    - cron: '30 */2 * * *'

jobs:
  run-reel-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai groq playwright requests
          playwright install chromium

      - name: Run Reel Generation Engine
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        working-directory: ContentFactory/reels
        run: |
          python generate_reel.py

      - name: Commit Rendered Video for CDN Access
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add ContentFactory/reels/output/output-reel.webm
          git commit -m "chore: auto-generate video reel for publishing [skip ci]" || echo "No changes to commit"
          git push

      - name: Run Instagram Reel Publishing Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        working-directory: ContentFactory/reels
        run: |
          python publish_reel.py
