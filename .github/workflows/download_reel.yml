name: Reel & Carousel Extraction Engine

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Instagram Reel or Carousel URL'
        required: true
        type: string

jobs:
  extract:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Latest Tools & Browser Impersonator
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install --upgrade yt-dlp gallery-dl openai-whisper curl_cffi

      - name: Fetch Media & Extract Metadata
        run: |
          mkdir -p output/media
          URL="${{ github.event.inputs.media_url }}"
          
          # 1. Download image slides via gallery-dl with User-Agent header
          gallery-dl --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36" --directory output/media "$URL" || true
          
          # 2. Download media & thumbnails via yt-dlp with browser impersonation
          yt-dlp --impersonate Chrome --write-info-json --write-thumbnail --all-subs -o "output/media/slide_%(playlist_index)s_%(title).20s [%(id)s].%(ext)s" "$URL" || true

      - name: Parse Metadata Caption
        shell: python
        run: |
          import json
          import glob
          
          files = glob.glob('output/media/*.info.json')
          if files:
              with open(files[0], 'r', encoding='utf-8') as f:
                  data = json.load(f)
              desc = data.get('description', '') or ''
              with open('output/caption.txt', 'w', encoding='utf-8') as f:
                  f.write(desc)
              print("Caption extracted successfully.")
          else:
              print("No metadata json found, skipping caption parse.")

      - name: Process All Carousel Video Slides (Whisper & Screenshots)
        run: |
          mkdir -p output/transcripts
          mkdir -p output/screenshots
          
          # Process any video MP4 files found across the carousel
          COUNT=1
          find output/media -type f -name "*.mp4" | sort | while read -r MP4_FILE; do
            echo "Processing video slide $COUNT: $MP4_FILE"
            
            # Transcribe audio for video slides
            whisper "$MP4_FILE" --model tiny --output_format txt --output_dir output/transcripts/ || true
            if [ -f "output/transcripts/*.txt" ]; then
              mv output/transcripts/*.txt "output/transcripts/slide_${COUNT}_transcript.txt" 2>/dev/null || true
            fi

            # Extract 1 FPS screenshots into dedicated slide folder
            SLIDE_SHOTS="output/screenshots/slide_${COUNT}"
            mkdir -p "$SLIDE_SHOTS"
            ffmpeg -i "$MP4_FILE" -vf "fps=1" "$SLIDE_SHOTS/frame_%03d.png"
            
            COUNT=$((COUNT+1))
          done

      - name: Commit & Store Assets in Repo
        run: |
          FOLDER_NAME="extraction_$(date +'%Y%m%d_%H%M%S')"
          mkdir -p "reels_analysis/$FOLDER_NAME"
          
          # Move all downloaded media (JPG, PNG, MP4, JSON) and parsed assets
          cp -r output/* "reels_analysis/$FOLDER_NAME/" 2>/dev/null || true
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reels_analysis/
          git commit -m "Extracted Reel/Carousel assets [skip ci]" || echo "No changes to commit"
          git push
