name: Aurelian War Room Autonomous Campaign

on:
  schedule:
    - cron: '0 * * * *'  # Runs twice daily at 00:00 and 12:00 UTC
  workflow_dispatch:

jobs:
  run-war-room:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Execute Rogue Harvester Node
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m AgentNetwork.agents.rogue_harvester

      - name: Execute Aurelian War Room Orchestrator
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m AgentNetwork.council.war_room_orchestrator

      - name: Commit State, Directives & Log Updates
        run: |
          git config --global user.name "Aurelian-WarRoom-Bot"
          git config --global user.email "bot@aurelian.internal"
          mkdir -p vault MediaFactory/vault
          git add vault/ MediaFactory/vault/
          git diff-index --quiet HEAD || git commit -m "auto(aurelian): sync war map state and harvester vault [skip ci]"
          git pull --rebase origin main
          git push
