name: Autonomous Content Pipeline

on:
  push:
    paths:
      - 'content/*.md'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-generativeai pyyaml requests

      - name: Execute Gemini Transformation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/transform.py

      - name: Dispatch Substack Note
        env:
          SUBSTACK_SESSION_COOKIE: ${{ secrets.SUBSTACK_SESSION_COOKIE }}
        run: python scripts/publish_substack.py

      - name: Archive Processed Post
        run: |
          mkdir -p content/archive
          mv content/*.md content/archive/ 2>/dev/null || true
          git config --global user.name 'Sovereign Automated Bot'
          git config --global user.email 'bot@github.com'
          git add .
          git commit -m "chore: archive published content" || exit 0
          git push
