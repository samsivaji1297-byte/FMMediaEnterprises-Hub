name: Autonomous SEO Research Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Target Topic / Keyword to Research'
        required: false
        default: 'High Agency Mindset and Systemic Execution'

  # Autonomous daily schedule (e.g., 09:00 UTC / 7:00 PM AEST)
  schedule:
    - cron: '0 9 * * *'

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai tenacity

      - name: Run End-to-End Autonomous Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Uses manual input if triggered in UI; otherwise defaults for scheduled run
          INPUT_TOPIC: ${{ github.event.inputs.topic || 'High Agency Mindset and Systemic Execution' }}
        run: |
          echo "=== Executing Autonomous Pipeline for Topic: '$INPUT_TOPIC' ==="
          python research_engine.py "$INPUT_TOPIC"
          python stage_and_transform.py
          python publish_to_blogger.py
