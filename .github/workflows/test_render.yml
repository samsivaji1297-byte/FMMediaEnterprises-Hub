name: Test Terminal Card Render

on:
  workflow_dispatch:

jobs:
  render-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies & Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation

      - name: Install Python Rendering Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install moviepy pillow numpy

      - name: Execute Standalone Test Render
        run: |
          python test_terminal_card_render.py

      - name: Upload Rendered Reel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: standalone-terminal-card-test
          path: test_output_reel.mp4
          retention-days: 3
