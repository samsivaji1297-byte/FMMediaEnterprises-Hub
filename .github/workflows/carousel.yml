name: Automated IG Carousel Engine

on:
  workflow_dispatch:

jobs:
  generate-slides:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm init -y
          npm install puppeteer @google/genai

      - name: Execute Dynamic AI Carousel Render Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node generate-carousel.js

      - name: Save Rendered Slide Artifact
        uses: actions/upload-artifact@v4
        with:
          name: instagram-carousel-slide
          path: output-slide-1.png
