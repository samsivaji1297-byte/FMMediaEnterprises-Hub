name: Digital War Room Multi-Agent Fleet Network

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:

jobs:
  run-agents:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System & FFmpeg Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install google-genai moviepy requests python-dotenv gtts pillow; fi

      - name: Execute Full War Room Fleet Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.IG_USER_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python AgentNetwork/main.py

      - name: Commit Updated Vault Queue, Conversion Log & Intelligence Memory
        run: |
          git config --global user.name "Aurelian-WarRoom-Bot"
          git config --global user.email "bot@aurelian.internal"
          mkdir -p vault MediaFactory/vault
          git add vault/ MediaFactory/vault/
          git diff-index --quiet HEAD || git commit -m "vault(aurelian): sync state, directives, and media factory queue [skip ci]"
          git pull --rebase origin main
          git push
